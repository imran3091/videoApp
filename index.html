<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>
    <h2>Upload a Video</h2>
    
    <form action="https://happening-america-composite-massage.trycloudflare.com/upload" method="POST" enctype="multipart/form-data">
        <div>
            <label for="video">Select Video File:</label> <br><br>
            <!-- name="video" অত্যন্ত গুরুত্বপূর্ণ -->
            <input type="file" id="video" name="video" accept="video/*" required>
        </div>
        <br>
        <button type="submit">Upload Now</button>
    </form>
</body>
</html>
